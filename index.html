<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Names - Chia 35 Học Sinh Thành 6 Nhóm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .wheel-spin {
            transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        
        <!-- Tiêu đề -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-900 mb-2">🎯 MÔ PHỎNG WHEEL OF NAMES CHIA NHÓM</h1>
            <p class="text-slate-600 font-medium">Quy tắc: 35 Học sinh &rarr; 5 Nhóm 6 người + 1 Nhóm 5 người</p>
        </div>

        <!-- Bố cục chính: Vòng quay bên trái - Bảng kết quả bên phải -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
            
            <!-- Cột Vòng Quay -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200 text-center flex flex-col items-center justify-center">
                <div class="relative w-48 h-48 mb-6 flex items-center justify-center bg-gradient-to-tr from-amber-400 via-rose-400 to-indigo-500 rounded-full border-4 border-white shadow-inner text-white font-black text-xl" id="wheel">
                    🎡 Wheel
                </div>
                
                <button onclick="quaySo()" id="btnSpin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-md transition transform active:scale-95 text-lg">
                    🚀 Quay Số Chắt Tên
                </button>
                
                <div id="statusText" class="mt-4 text-sm font-semibold text-slate-700 h-6">
                    Sẵn sàng quay học sinh đầu tiên...
                </div>
            </div>

            <!-- Cột Hiển thị Bảng 6 Nhóm -->
            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="groupsContainer">
                <!-- 6 Nhóm sẽ được tự động vẽ ở đây -->
            </div>
        </div>

    </div>

    <script>
        // Khởi tạo danh sách 35 học sinh
        let danhSachGoc = Array.from({length: 35}, (_, i) => `Học sinh ${String(i + 1).padStart(2, '0')}`);
        let hocSinhConLai = [...danhSachGoc];
        
        // Cấu hình sỉ số: 5 nhóm 6 người, 1 nhóm 5 người
        const sisoNhom = [6, 6, 6, 6, 6, 5];
        let nhomHienTaiIdx = 0;
        let ketQuaNhom = [[], [], [], [], [], []];

        // Khởi tạo khung hiển thị 6 Bảng
        function renderTables() {
            const container = document.getElementById('groupsContainer');
            container.innerHTML = '';

            sisoNhom.forEach((maxCount, idx) => {
                const members = ketQuaNhom[idx];
                let rows = '';
                
                for(let i = 0; i < maxCount; i++) {
                    const name = members[i] ? members[i] : '<span class="text-slate-300 italic">-- Chờ quay --</span>';
                    rows += `
                        <tr class="border-b text-xs">
                            <td class="py-1.5 px-3 text-slate-400 font-bold w-8">${i + 1}</td>
                            <td class="py-1.5 px-3 font-semibold text-slate-700">${name}</td>
                        </tr>
                    `;
                }

                const isActive = (idx === nhomHienTaiIdx && hocSinhConLai.length > 0);

                container.innerHTML += `
                    <div class="bg-white rounded-xl border ${isActive ? 'border-2 border-blue-500 shadow-lg' : 'border-slate-200 shadow-sm'} overflow-hidden">
                        <div class="${isActive ? 'bg-blue-600' : 'bg-slate-700'} text-white p-2.5 font-bold text-sm flex justify-between items-center">
                            <span>NHÓM ${idx + 1}</span>
                            <span class="text-xs bg-black/20 px-2 py-0.5 rounded-full">${members.length}/${maxCount} HS</span>
                        </div>
                        <table class="w-full text-left">
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            });
        }

        // Thao tác Quay số ngẫu nhiên mô phỏng Wheel of Names
        function quaySo() {
            if (hocSinhConLai.length === 0) {
                alert("Đã hoàn tất chia đủ 35 học sinh vào 6 nhóm!");
                return;
            }

            const btn = document.getElementById('btnSpin');
            const status = document.getElementById('statusText');
            const wheel = document.getElementById('wheel');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            status.innerText = "Đang quay Vòng quay...";
            wheel.classList.add('wheel-spin');
            wheel.style.transform = `rotate(${Math.floor(Math.random() * 360) + 1440}deg)`;

            setTimeout(() => {
                // Chọn ngẫu nhiên 1 HS & xóa khỏi vòng quay
                const randIndex = Math.floor(Math.random() * hocSinhConLai.length);
                const hsDuocChon = hocSinhConLai.splice(randIndex, 1)[0];

                // Đưa vào nhóm hiện tại
                ketQuaNhom[nhomHienTaiIdx].push(hsDuocChon);

                // Nếu nhóm hiện tại đã đủ sỉ số -> Chuyển sang nhóm tiếp theo
                if (ketQuaNhom[nhomHienTaiIdx].length === sisoNhom[nhomHienTaiIdx]) {
                    nhomHienTaiIdx++;
                }

                status.innerHTML = `🎉 Đã chọn: <span class="text-blue-600 font-bold">${hsDuocChon}</span> (Đã Remove khỏi quay)`;
                
                renderTables();
                
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                wheel.classList.remove('wheel-spin');
                wheel.style.transform = 'rotate(0deg)';

                if(hocSinhConLai.length === 0) {
                    status.innerHTML = "✅ <span class="text-green-600 font-bold">HOÀN THÀNH CHIA 35 HS VÀO 6 NHÓM!</span>";
                }
            }, 1200);
        }

        // Chạy lần đầu
        renderTables();
    </script>
</body>
</html>
